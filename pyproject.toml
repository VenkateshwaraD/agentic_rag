[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag-copilot"
version = "0.1.0"
description = "Compliance-aware agentic RAG client-service copilot"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    "langchain-anthropic>=0.3,<0.4",
    "langchain-aws>=0.2,<0.3",
    "boto3>=1.34",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "opensearch-py>=2.6",
    "sentence-transformers>=3.0",
    "ragas>=0.2",
    "langfuse>=2.50",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "structlog>=24.4",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12",
    "pypdf>=4.3",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
copilot = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires docker-backed services (Postgres, OpenSearch)",
    "e2e: requires full stack + LLM credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
exclude = "src/ui"  # streamlit app.py collides with the `app` package name
ignore_missing_imports = true
warn_unused_ignores = true
