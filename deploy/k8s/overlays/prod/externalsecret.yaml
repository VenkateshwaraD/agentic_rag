# Production secrets come from AWS Secrets Manager via the External Secrets
# Operator — no plaintext secret material lives in this repo. Requires the
# operator + a ClusterSecretStore named "aws-secrets-manager" bound to IRSA.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: copilot-secrets
  namespace: agentic-rag
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: copilot-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: {key: agentic-rag/prod/anthropic-api-key}
    - secretKey: DATABASE_URL
      remoteRef: {key: agentic-rag/prod/database-url}
    - secretKey: OPS_DATABASE_URL
      remoteRef: {key: agentic-rag/prod/ops-database-url}
    - secretKey: OPS_ADMIN_DATABASE_URL
      remoteRef: {key: agentic-rag/prod/ops-admin-database-url}
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef: {key: agentic-rag/prod/langfuse-public-key}
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef: {key: agentic-rag/prod/langfuse-secret-key}
    - secretKey: ADMIN_TOKEN
      remoteRef: {key: agentic-rag/prod/admin-token}
