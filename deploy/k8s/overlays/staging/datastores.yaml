# Staging-only datastores (Postgres + OpenSearch in-cluster StatefulSets).
# PROD: replace with RDS + Amazon OpenSearch Service endpoints via ConfigMap.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agentic-rag
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - {name: POSTGRES_USER, value: rag}
            - {name: POSTGRES_PASSWORD, value: staging-only-change-me}
            - {name: POSTGRES_DB, value: postgres}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: seed, mountPath: /docker-entrypoint-initdb.d/init.sh, subPath: init.sh}
            - {name: seed, mountPath: /seed}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
      volumes:
        - name: seed
          configMap: {name: db-seed}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agentic-rag
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: agentic-rag
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels: {app: opensearch}
  template:
    metadata:
      labels: {app: opensearch}
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.1
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports: [{containerPort: 9200}]
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "1", memory: "1.5Gi"}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: agentic-rag
spec:
  selector: {app: opensearch}
  ports: [{port: 9200}]
