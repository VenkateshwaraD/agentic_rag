apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: agentic-rag
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: backend}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: streamlit
  namespace: agentic-rag
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: streamlit}
