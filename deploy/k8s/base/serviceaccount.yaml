# IRSA: annotate with the IAM role ARN that grants Bedrock InvokeModel
# (amazon.titan-embed-text-v2) — eks.amazonaws.com/role-arn.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot-backend
  namespace: agentic-rag
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/agentic-rag-bedrock"
