apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccount.yaml
  - backend.yaml
  - streamlit.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
# NOTE: secret.yaml intentionally excluded — staging supplies the dev
# placeholder secret itself; prod uses an ExternalSecret (no plaintext
# secret material in the repo).
