apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: agentic-rag
spec:
  replicas: 1
  selector:
    matchLabels: {app: streamlit}
  template:
    metadata:
      labels: {app: streamlit}
    spec:
      containers:
        - name: streamlit
          image: ECR_REGISTRY/agentic-rag-frontend:IMAGE_TAG
          envFrom:
            - configMapRef: {name: copilot-config}
          ports:
            - containerPort: 8501
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
  namespace: agentic-rag
spec:
  selector: {app: streamlit}
  ports:
    - port: 8501
      targetPort: 8501
