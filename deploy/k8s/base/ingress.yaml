apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copilot
  namespace: agentic-rag
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
spec:
  rules:
    - host: copilot.internal.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: backend, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: streamlit, port: {number: 8501}}
